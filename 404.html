<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Jared Lewis</title>
    <style>
        :root {
            --bg: #f6f6f6;
            --text: #1d1d1f;
            --text-secondary: #515154;
            --text-tertiary: #86868b;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1d1d1f;
                --text: #f5f5f7;
                --text-secondary: #a1a1a6;
                --text-tertiary: #6e6e73;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 400px;
        }

        h1 {
            font-size: 72px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        p {
            font-size: 17px;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        a {
            color: var(--text);
            font-size: 14px;
            text-decoration: none;
            border-bottom: 1px solid var(--text-tertiary);
            padding-bottom: 2px;
        }

        a:hover {
            border-color: var(--text);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Constraint check failed: page not found.</p>
        <a href="/">Return home</a>
    </div>
</body>
</html>
